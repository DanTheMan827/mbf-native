name: build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.401

      - name: Stage deployed MBF agent and Android platform-tools
        shell: pwsh
        run: ./eng/Bootstrap.ps1

      - name: Restore
        run: dotnet restore ./ModsBeforeFriday.sln -p:Platform=x64

      - name: Verify architectural boundaries
        shell: pwsh
        run: ./eng/Verify-Architecture.ps1

      - name: Test ADB protocol project
        run: dotnet test ./tests/ModsBeforeFriday.Adb.Tests/ModsBeforeFriday.Adb.Tests.csproj -c Release --no-restore

      - name: Test core project
        run: dotnet test ./tests/ModsBeforeFriday.Core.Tests/ModsBeforeFriday.Core.Tests.csproj -c Release --no-restore

      - name: Test application project
        run: dotnet test ./tests/ModsBeforeFriday.Application.Tests/ModsBeforeFriday.Application.Tests.csproj -c Release --no-restore

      - name: Test backend project
        run: dotnet test ./tests/ModsBeforeFriday.Backend.Tests/ModsBeforeFriday.Backend.Tests.csproj -c Release --no-restore

      - name: Build
        run: dotnet build ./src/ModsBeforeFriday.App/ModsBeforeFriday.App.csproj -c Release --no-restore -p:Platform=x64
